services:
  - type: web
    name: wavelength-chat
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
